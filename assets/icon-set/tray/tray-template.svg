<!--
  Menu-bar template, plain state.

  The viewBox CROPS the 1024 authoring canvas to 800 units centred on
  the block, rather than rendering the full canvas. Framed at 1024 the
  block filled only 64%w x 61%h of the 44px tile against the previous
  icon's 86% x 75%, and read as visibly undersized in the menubar.
  At 800 it is 80%w x 76%h — the height matches the old glyph almost
  exactly, which is the axis that matters in a fixed-height menubar.

  800 rather than something tighter because the alert variant shares
  this number: same viewBox size means the block is the same size in
  both states, so toggling the badge does not make it jump. See the
  note in tray-alert-template.svg.

  Artwork geometry is untouched — this is a framing change only.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="112 160 800 800">
  <defs>
    <mask id="seams">
      <rect x="112" y="160" width="800" height="800" fill="#FFFFFF"></rect>
      <path d="M512 256 L512 864 M192 432 L512 608 M832 432 L512 608" stroke="#000000" stroke-width="48" fill="none"></path>
    </mask>
  </defs>
  <path mask="url(#seams)" fill="#000000" d="M512 256 L832 432 L832 688 L512 864 L192 688 L192 432 Z"></path>
</svg>
