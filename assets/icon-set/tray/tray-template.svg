<!--
  Menu-bar template, plain state.

  The viewBox CROPS the 1024 authoring canvas rather than rendering all
  of it, because in the menubar the tile is padding and the block is the
  icon.

  WHY THE CROP IS THIS TIGHT. `tray-icon` normalises whatever we hand it
  to eighteen points tall, preserving aspect:

      let icon_height: f64 = 18.0;
      let icon_width = (width as f64) / (height as f64 / icon_height);

  The pixel size of the tile is therefore irrelevant — only the FRACTION
  of the tile the block inks decides how large it renders. Measured
  against the two neighbours in this menubar:

      ChatGPT.app    94.4% of tile  ->  17.0pt of glyph
      Claudepot      77.3%          ->  13.9pt      (an 800 viewBox)
      Claude.app     70.8%          ->  12.7pt

  Same ink height in the file, three different sizes on screen. At 672
  the block inks 90.5% and renders 16.3pt, which is the neighbourhood
  the other menubar icons live in.

  672 rather than tighter because the ALERT variant shares this number:
  an identical viewBox size means the block renders at an identical size
  in both states, so toggling the badge does not make it jump. The badge
  is what sets the floor — see the derivation in
  tray-alert-template.svg.

  Artwork geometry is untouched apart from the -48 y shift that centred
  the block on the 1024 canvas (its bbox centre was 560 against a centre
  of 512, which read as low in the Dock). The block is centred in this
  viewBox: 16 units of margin left and right, 32 top and bottom.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="672" height="672" viewBox="176 176 672 672">
  <defs>
    <mask id="seams">
      <rect x="176" y="176" width="672" height="672" fill="#FFFFFF"></rect>
      <path d="M512 208 L512 816 M192 384 L512 560 M832 384 L512 560" stroke="#000000" stroke-width="48" fill="none"></path>
    </mask>
  </defs>
  <path mask="url(#seams)" fill="#000000" d="M512 208 L832 384 L832 640 L512 816 L192 640 L192 384 Z"></path>
</svg>
