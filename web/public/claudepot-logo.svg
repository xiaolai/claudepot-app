<!-- Derived from assets/icon-set/windows/icon-glyph.svg — the plateless
     master. Do not hand-draw here; re-derive from that file.

     Plateless on purpose, and NOT the plated app-icon-flat.svg that
     web/src/app/icon.svg (the favicon) uses. The nav sits on the site's
     own surface and the site is theme-aware (see styles/theme.css), so
     a plated mark would be a #DCD8D2 card in a light nav and a glaring
     one in a dark nav. That is the same reason the Windows icon drops
     the plate — it "shows the icon against chrome of every shade, so
     the plate would read as a grey card floating behind the block"
     (AGENTS.md, Icon assets). A favicon keeps its plate because a tab
     strip is an enclosure; a nav is not.

     Theme-safe without a swap: the four block faces are warm terracotta
     and read on both backgrounds, so one file serves both themes and
     there is no second master to keep in step.

     viewBox is squared to the 24/32px box the nav renders it into
     (the Windows master's 800x768 would letterbox). 800x800 centred on
     the block's midpoint, which is now (512, 512): the block was shifted
     -48 so its bbox centre matched the canvas centre instead of sitting
     48 units low, which read as off-centre in the Dock. The block inks
     ~80% of the width, matching the Windows framing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="112 112 800 800">
  <path fill="#F7B47C" d="M512 208 L192 384 L512 560 Z"></path>
  <path fill="#E8833A" d="M512 208 L832 384 L512 560 Z"></path>
  <path fill="#C0642A" d="M192 384 L512 560 L512 816 L192 640 Z"></path>
  <path fill="#9A4F1B" d="M832 384 L512 560 L512 816 L832 640 Z"></path>
</svg>
